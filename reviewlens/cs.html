<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewLens 상담봇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:#eef1f6;color:#2b2f38;font-family:'Pretendard','Malgun Gothic',sans-serif;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center}
a{text-decoration:none;color:inherit}
.bar{width:100%;max-width:780px;display:flex;align-items:center;gap:12px;padding:16px 22px}
.bar .home{display:flex;align-items:center;gap:6px;color:#6c7280;font-size:13px;font-weight:600}
.bar .home i{width:16px;height:16px}
.bar .grow{flex:1}
.win{width:100%;max-width:780px;flex:1;min-height:0;background:#fff;border:1px solid #e6e9ef;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(30,40,70,.07)}
.head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #eef0f3}
.head .av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#5b8def,#7c6cf0);display:flex;align-items:center;justify-content:center}
.head .av i{width:22px;height:22px;color:#fff}
.head b{font-size:15px;font-weight:800}.head small{display:block;color:#9aa0ac;font-size:11.5px;margin-top:2px}
.head .dot{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#1fbf8f;font-weight:700}
.head .dot i{width:8px;height:8px;border-radius:50%;background:#1fbf8f;display:inline-block}
.box{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;font-size:14px;line-height:1.6}
.msg.u{align-self:flex-end;background:#4f7cf7;color:#fff;padding:11px 15px;border-radius:15px;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;display:flex;gap:10px;max-width:90%}
.msg.a .ab{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b8def,#7c6cf0);flex:none}
.msg.a .body{background:#f4f6fa;padding:12px 15px;border-radius:15px;border-bottom-left-radius:4px}
.msg.a .ev{margin-top:9px;background:#fff;border:1px solid #e6e9ef;border-radius:10px;padding:10px 12px;font-size:11.5px;color:#7a8090}
.msg.a .ev .t{font-weight:700;color:#555;margin-bottom:6px}
.msg.a .ev div{padding:3px 0;border-top:1px dashed #e8eaef}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 14px}
.chips span{font-size:12.5px;border:1px solid #e6e9ef;border-radius:20px;padding:8px 14px;color:#555;cursor:pointer;background:#fff}
.chips span:hover{background:#f4f6fa}
.in{display:flex;gap:10px;padding:16px 22px;border-top:1px solid #eef0f3}
.in input{flex:1;border:1px solid #e6e9ef;border-radius:13px;padding:13px 16px;font-size:14px;outline:0}
.in input:focus{border-color:#bcd0ff}
.in button{width:48px;border:0;border-radius:13px;background:#4f7cf7;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.in button:disabled{opacity:.5}.in button i{width:18px;height:18px}
</style>
</head>
<body>
  <div class="bar"><a class="home" href="/"><i data-lucide="arrow-left"></i> 홈</a><div class="grow"></div></div>
  <div class="win">
    <div class="head"><span class="av"><i data-lucide="bot"></i></span><div><b>ReviewLens 상담봇</b><small>실제 리뷰를 근거로 답해드려요</small></div><span class="dot"><i></i> 온라인</span></div>
    <div class="box" id="chatbox">
      <div class="msg a"><span class="ab"></span><div class="body">안녕하세요! 무엇을 도와드릴까요? 상품·배송·품질에 대해 <b>실제 리뷰를 근거로</b> 답해드려요.</div></div>
    </div>
    <div class="chips" id="chips">
      <span>배송 빠른 편인가요?</span><span>이어폰 소리 어때요?</span><span>포장 상태 괜찮나요?</span><span>가성비 좋은 거 추천해줘</span>
    </div>
    <div class="in"><input id="q" placeholder="궁금한 점을 입력해주세요..." onkeydown="if(event.key==='Enter')ask()"><button id="send" onclick="ask()"><i data-lucide="send"></i></button></div>
  </div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
document.getElementById('chips').addEventListener('click',e=>{if(e.target.tagName==='SPAN'){document.getElementById('q').value=e.target.textContent;ask();}});
async function ask(){
  const box=document.getElementById('chatbox'),inp=document.getElementById('q'),btn=document.getElementById('send'),chips=document.getElementById('chips');
  const q=inp.value.trim();if(!q)return;inp.value="";btn.disabled=inp.disabled=true;if(chips)chips.style.display='none';
  box.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div>`);
  const a=document.createElement('div');a.className='msg a';a.innerHTML='<span class="ab"></span><div class="body">…</div>';
  box.appendChild(a);const body=a.querySelector('.body');box.scrollTop=box.scrollHeight;
  let ans="",ev="",st=false;
  try{const res=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let nl;
      while((nl=buf.indexOf("\n"))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);if(!line)continue;const o=JSON.parse(line);
        if(o.token){if(!st){body.textContent="";st=true;}ans+=o.token;body.textContent=ans;box.scrollTop=box.scrollHeight;}
        if(o.replace!==undefined){ans=o.replace;body.textContent=ans;}if(o.evidence!==undefined)ev=o.evidence;}}
  }catch(e){body.textContent="응답을 받지 못했어요. (서버/Ollama 확인)";}
  if(ev){const lines=ev.split("\n").filter(Boolean).map(l=>`<div>${esc(l)}</div>`).join("");body.insertAdjacentHTML('beforeend',`<div class="ev"><div class="t">근거 리뷰</div>${lines}</div>`);}
  btn.disabled=inp.disabled=false;inp.focus();box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
