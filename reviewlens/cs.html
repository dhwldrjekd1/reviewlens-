<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewLens 상담봇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--line:#e6e9ef;--blue:#4f7cf7}
body{height:100vh;background:#f7f8fb;color:#2b2f38;font-family:'Pretendard','Malgun Gothic',sans-serif;letter-spacing:-.01em;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:13px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top .home{display:flex;align-items:center;gap:6px;color:#6c7280;font-size:13px;font-weight:600}
.top .home i{width:16px;height:16px}
.top .ti{display:flex;align-items:center;gap:9px}
.top .ti .av{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b8def,#7c6cf0);display:flex;align-items:center;justify-content:center}
.top .ti .av i{width:17px;height:17px;color:#fff}
.top .ti b{font-size:14px;font-weight:800}.top .ti small{display:block;color:#9aa0ac;font-size:11px}
.top .grow{flex:1}
.top .new{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#5c6270;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;transition:.12s}
.top .new:hover{border-color:#cdd3df;color:#222}.top .new i{width:15px;height:15px}
.box{flex:1;overflow-y:auto;padding:26px 18px}
.box::-webkit-scrollbar{width:9px}.box::-webkit-scrollbar-thumb{background:#d7dce6;border-radius:5px}
::selection{background:#dbe6ff;color:#3a5bd0}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{font-size:14.5px;line-height:1.65}
.msg.u{align-self:flex-end;max-width:80%;background:var(--blue);color:#fff;padding:11px 15px;border-radius:16px;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;display:flex;gap:11px;max-width:92%}
.msg.a .ab{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b8def,#7c6cf0);flex:none}
.msg.a .body{background:#fff;border:1px solid var(--line);padding:13px 16px;border-radius:16px;border-bottom-left-radius:5px;white-space:pre-wrap}
.msg.a .ev{margin-top:10px;background:#f7f8fb;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:11.5px;color:#7a8090}
.msg.a .ev .t{font-weight:700;color:#555;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.msg.a .ev .t i{width:13px;height:13px}
.msg.a .ev div.r{padding:3px 0;border-top:1px dashed #e8eaef}
.dock{border-top:1px solid var(--line);background:#fff;padding:12px 18px 14px}
.dockin{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.chips span{font-size:12.5px;border:1px solid var(--line);border-radius:18px;padding:7px 13px;color:#555;cursor:pointer;background:#fff;transition:.12s}
.chips span:hover{background:#f0f4ff;border-color:#bcd0ff;color:#3a5bd0}
.in{display:flex;gap:10px}
.in input{flex:1;border:1px solid var(--line);border-radius:13px;padding:13px 16px;font-size:14.5px;outline:0}
.in input:focus{border-color:#bcd0ff}
.in button{width:50px;border:0;border-radius:13px;background:var(--blue);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.in button:disabled{opacity:.45}.in button i{width:18px;height:18px}
.hint{text-align:center;font-size:11px;color:#aab;margin-top:9px}
</style>
</head>
<body>
  <div class="top">
    <a class="home" href="/"><i data-lucide="arrow-left"></i> 홈</a>
    <div class="ti"><span class="av"><i data-lucide="bot"></i></span><div><b>ReviewLens 상담봇</b><small>실제 리뷰를 근거로 답해드려요</small></div></div>
    <div class="grow"></div>
    <button class="new" id="newchat"><i data-lucide="plus"></i> 새 대화</button>
  </div>
  <div class="box" id="box"><div class="col" id="col"></div></div>
  <div class="dock"><div class="dockin">
    <div class="chips" id="chips">
      <span>전체 리뷰 알려줘</span><span>배송 빠른 편인가요?</span><span>이어폰 소리 어때요?</span><span>포장 상태 괜찮나요?</span><span>가성비 좋은 거 추천해줘</span>
    </div>
    <div class="in"><input id="q" placeholder="궁금한 점을 입력해주세요..." onkeydown="if(event.key==='Enter')ask()"><button id="send" onclick="ask()"><i data-lucide="send"></i></button></div>
    <div class="hint">대화는 이 브라우저에만 저장됩니다 · 언제든 ‘새 대화’로 초기화</div>
  </div></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
const col=document.getElementById('col'),box=document.getElementById('box');
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const KEY='rl_chat';
let HIST=[]; try{HIST=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){HIST=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(HIST))}catch(e){}};
const scroll=()=>{box.scrollTop=box.scrollHeight;};
function evHtml(ev){ if(!ev)return"";
  const lines=ev.split("\n").filter(Boolean).map(l=>`<div class="r">${esc(l)}</div>`).join("");
  return `<div class="ev"><div class="t"><i data-lucide="search"></i>근거 리뷰</div>${lines}</div>`; }
function addUser(t){ const d=document.createElement('div'); d.className='msg u'; d.textContent=t; col.appendChild(d); return d; }
function addBot(t,ev){ const d=document.createElement('div'); d.className='msg a';
  d.innerHTML=`<span class="ab"></span><div class="body">${t===null?'…':esc(t)}</div>`;
  if(ev)d.querySelector('.body').insertAdjacentHTML('beforeend',evHtml(ev));
  col.appendChild(d); return d; }
// 대화 복원(없으면 인사말)
function render(){ col.innerHTML='';
  if(!HIST.length){ addBot('안녕하세요! 무엇을 도와드릴까요? 상품·배송·품질·전체 리뷰에 대해 실제 리뷰를 근거로 답해드려요.'); }
  else { HIST.forEach(m=> m.role==='u'?addUser(m.text):addBot(m.text,m.ev)); }
  if(window.lucide)lucide.createIcons(); scroll(); }
// 스트리밍 코어(기존 동작 보존) + 히스토리 저장
async function ask(){
  const inp=document.getElementById('q'),btn=document.getElementById('send');
  const q=inp.value.trim(); if(!q)return; inp.value=""; btn.disabled=inp.disabled=true;
  addUser(q); HIST.push({role:'u',text:q}); save();
  const a=addBot(null),body=a.querySelector('.body'); scroll();
  let ans="",ev="",st=false;
  try{const res=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let nl;
      while((nl=buf.indexOf("\n"))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);if(!line)continue;const o=JSON.parse(line);
        if(o.token){if(!st){body.textContent="";st=true;}ans+=o.token;body.textContent=ans;scroll();}
        if(o.replace!==undefined){ans=o.replace;body.textContent=ans;}if(o.evidence!==undefined)ev=o.evidence;}}
  }catch(e){ans="응답을 받지 못했어요. (서버/Ollama 확인)";body.textContent=ans;}
  if(ev){body.insertAdjacentHTML('beforeend',evHtml(ev));if(window.lucide)lucide.createIcons();}
  HIST.push({role:'a',text:ans,ev}); save();
  btn.disabled=inp.disabled=false; inp.focus(); scroll();
}
document.getElementById('chips').addEventListener('click',e=>{if(e.target.tagName==='SPAN'){document.getElementById('q').value=e.target.textContent;ask();}});
document.getElementById('newchat').addEventListener('click',()=>{ HIST=[]; save(); render(); document.getElementById('q').focus(); });
lucide.createIcons();
render();
</script>
</body>
</html>
