<!doctype html>
<html lang="ko">
<!-- 껍데기. 탭 내용은 tabs/<name>.html 을 fetch로 불러와 #wrap에 주입. 서버는 정적 파일만(StaticFiles) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewLens — 전략 보드</title>
<link rel="stylesheet" href="/static/dashboard.css?v=5">
</head>
<body>
<div class="app">

  <aside class="side">
    <a class="logo" href="/"><span class="ic"><i data-lucide="bar-chart-3" style="color:#fff"></i></span>ReviewLens</a>
    <nav class="nav" id="nav">
      <a class="on" data-v="strategy"><i data-lucide="layout-dashboard"></i> 전략 보드</a>
      <a data-v="review"><i data-lucide="message-square"></i> 리뷰 분석</a>
      <a data-v="product"><i data-lucide="package"></i> 상품 분석</a>
      <a data-v="customer"><i data-lucide="users"></i> 고객 인사이트</a>
      <a data-v="rival"><i data-lucide="trending-up"></i> 경쟁사 분석</a>
      <a data-v="market"><i data-lucide="megaphone"></i> 마케팅 추천</a>
      <a href="/cs"><i data-lucide="bot"></i> CS 챗봇 ↗</a>
      <a data-v="alert"><i data-lucide="bell"></i> 알림 센터</a>
      <div class="sep"></div>
      <a data-v="data"><i data-lucide="database"></i> 데이터 관리</a>
      <a data-v="setting"><i data-lucide="settings"></i> 설정</a>
    </nav>
    <div class="grow"></div>
    <div class="ucard"><span class="av">M</span><span><small>마케팅팀</small><b>Marketing Team</b></span><span class="ch"><i data-lucide="chevron-down"></i></span></div>
    <div class="period">데이터 기간<b>2025.05.12 ~ 2025.05.18</b>비교 기간<b>2025.05.05 ~ 2025.05.11</b></div>
    <div class="dlbtn"><i data-lucide="download"></i> 보고서 다운로드 <i data-lucide="arrow-right"></i></div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="pill"><i data-lucide="calendar-days"></i> 2025.05.12 ~ 2025.05.18 (최근 7일)</div>
      <div class="pill">카테고리 전체 <i data-lucide="chevron-down"></i></div><div class="grow"></div>
      <div class="bell"><i data-lucide="bell"></i><span class="b">8</span></div>
      <button class="share"><i data-lucide="share-2"></i> 인사이트 요약 공유</button>
    </header>
    <div class="wrap" id="wrap"></div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
const nav=document.getElementById('nav'), wrap=document.getElementById('wrap'), cache={};

// 탭 partial 로드 (한 번 받은 건 캐시)
async function load(v){
  try{ if(!cache[v]) cache[v]=await fetch('/tabs/'+v+'.html',{cache:'no-store'}).then(r=>r.text()); wrap.innerHTML=cache[v]; }
  catch(e){ wrap.innerHTML='<div class="panel">탭을 불러오지 못했어요. (서버로 띄워야 합니다)</div>'; }
  if(window.lucide) lucide.createIcons();   // 사이드바 + 주입된 탭 아이콘 렌더
  window.scrollTo(0,0);
}
nav.addEventListener('click',e=>{const a=e.target.closest('a[data-v]');if(!a)return;
  nav.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===a)); load(a.dataset.v);});
load('strategy');

// AI Q&A — 실제 챗봇(/api/chat/stream). 전역 함수(탭의 inline onclick에서 호출)
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function ask(){
  const box=document.getElementById('chatbox'),inp=document.getElementById('q'),btn=document.getElementById('send');
  const q=inp.value.trim();if(!q)return;inp.value="";btn.disabled=inp.disabled=true;
  box.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div>`);
  const a=document.createElement('div');a.className='msg a';a.innerHTML='<span class="ab"></span><div>…</div>';
  box.appendChild(a);const body=a.querySelector('div');box.scrollTop=box.scrollHeight;
  let ans="",ev="",st=false;
  try{const res=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let nl;
      while((nl=buf.indexOf("\n"))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);if(!line)continue;const o=JSON.parse(line);
        if(o.token){if(!st){body.textContent="";st=true;}ans+=o.token;body.textContent=ans;box.scrollTop=box.scrollHeight;}
        if(o.replace!==undefined){ans=o.replace;body.textContent=ans;}if(o.evidence!==undefined)ev=o.evidence;}}
  }catch(e){body.textContent="응답을 받지 못했어요. (서버/Ollama 확인)";}
  if(ev){const d=document.createElement('div');d.className='ev';d.innerHTML=ev.split("\n").map(esc).join("<br>");body.appendChild(d);}
  btn.disabled=inp.disabled=false;inp.focus();box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
